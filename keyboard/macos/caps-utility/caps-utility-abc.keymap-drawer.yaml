# Visual specification for the macOS Karabiner rule:
# Caps Utility Layer - ABC Standard
#
# F1-F12 and PrtSc depend on the independent 60% Keyboard Compatibility rule.
# Caps+Right Shift and Right Shift+Caps both emit Caps Lock.
layout:
  qmk_keyboard: dztech/dz60rgb_ansi/v2
  layout_name: LAYOUT_60_ansi
  version: "30.1"

layers:
  BASE_ABC:
    - [{t: Esc, s: "~"}, "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", BSpace]
    - [Tab, Q, W, E, R, T, Y, U, I, O, P, "[", "]", "\\"]
    - [{t: CAPS_UTILITY}, A, S, D, F, G, H, J, K, L, ";", "'", Enter]
    - [Shift, Z, X, C, V, B, N, M, {t: ",", s: "<"}, {t: ".", s: ">"}, {t: "/", s: "?"}, Shift]
    - [Ctrl, Opt, Cmd, Space, Cmd, Opt, Menu, Ctrl]

  BASE_COLEMAK_DH:
    - [{t: Esc, s: "~"}, "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", BSpace]
    - [Tab, Q, W, F, P, B, J, L, U, Y, ";", "[", "]", "\\"]
    - [{t: CAPS_UTILITY}, A, R, S, T, G, M, N, E, I, O, "'", Enter]
    - [Shift, X, C, D, V, Z, K, H, {t: ",", s: "<"}, {t: ".", s: ">"}, {t: "/", s: "?"}, Shift]
    - [Ctrl, Opt, Cmd, Space, Cmd, Opt, Menu, Ctrl]

  CAPS_UTILITY_ABC:
    - [{t: "`", s: "~"}, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12, "⌥⌫"]
    - [
        {type: trans},
        {type: trans},
        "⌘W",
        End,
        "⌘R",
        "⌘T",
        {type: trans},
        PgUp,
        Tab,
        Delete,
        {t: "´", s: "¨"},
        Esc,
        {type: trans},
        {type: trans}
      ]
    - [
        {type: held},
        Home,
        PrtSc,
        PgDn,
        "⌘F",
        Esc,
        Left,
        Down,
        Up,
        Right,
        {t: BSpace, s: Delete},
        {type: trans},
        {type: trans}
      ]
    - [
        {type: trans},
        "⌘Z",
        "⌘X",
        "⌘C",
        "⌘V",
        {type: trans},
        "ñ",
        Enter,
        {type: trans},
        {type: trans},
        {t: "¿", s: "¡"},
        CapsLock
      ]
    - [
        {type: trans},
        {type: trans},
        {type: trans},
        "Base Next",
        {type: trans},
        {type: trans},
        {type: trans},
        {type: trans}
      ]
